<!-- Section-->
<section class="py-5">
  <div class="container px-4 px-lg-5 mt-5">
    <div
      class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center"
    >
      <div
        class="col mb-4"
        *ngFor="let product of products"
        (click)="navigateToProduct(product.id)"
      >
        <div class="card h-100" style="height: 350px;">
          <!-- Product image -->
          <img
            class="card-img-top p-2"
            [src]="product.image"
            alt="..."
            style="height: 150px; object-fit: contain;"
          />
          <!-- Product details -->
          <div class="card-body p-3">
            <div class="text-center">
              <!-- Product name -->
              <p class="mb-2">{{ product.title | limitWordsPipe : 3 }}</p>
              <!-- Product price -->
              <small class="text-muted">{{product.price * 130 | currency : "Ksh "}}</small>
            </div>
          </div>
          <!-- Product actions -->
          <div class="card-footer p-2 pt-0 border-top-0 bg-transparent">
            <div class="text-center">
              <a class="btn btn-sm btn-outline-dark mt-auto" (click)="navigateToProduct(product.id)">View Product</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
