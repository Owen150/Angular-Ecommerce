<div class="p-3">
    <div class="p-3 border border-1 border-dark rounded">
        <!-- String Interpolation -->
        <div>{{ title }}</div>
        <br>
        <!-- Property Binding -->
        <div [innerText]="title"></div>
        <input type="text" [disabled]="isDisabled" placeholder="Enter text here" />
        <br>
        <!-- Event Binding -->
        <button (click)="clickFunction(1,2)"></button>
        <br>
        <!-- Two way data binding: Exchanging data from View to Component then from Component to View at the same time -->
        <input [(ngModel)]="name" type="text"/>
        <div>{{ name }}</div> 
    </div>
</div>

<!-- Js: High Level Interpreted Programming Language used to create dynamic and interactive web applications -->
<!-- Ts: Superset of Js with static typing and additional features. Static typing helps catch errors at compile time, improving code quality and maintainability -->

<!-- Key Features of Ts -->
<!-- 1. Static typing: Involves specifying the type of a variable as well as function parameter types at their declaration time to ensure code consistency and help developers catch type-related errors early in the development process -->
<!-- 2. Object-Oriented Programming: Supports classes, interfaces, inheritance, and other OOP concepts -->
<!-- 3. Enhanced Development Experience: Provides better tooling, debugging, and code analysis capabilities -->

<!-- var vs let vs const -->
<!-- var is function-scoped, can be redeclared, can be re-assigned/updated -->
<!-- let is block-scoped, can be re-assigned/updated but not redeclared -->
<!-- const is block-scoped and immutable helping to prevent unwanted data modifications/assignments -->

<!-- Browser doesnt understand ts code. Thus Angular compiler transforms all the Ts Code to Js then runs it in the browser -->
<!-- Ts is a strongly typed language; Js is loosely typed -->
<!-- Ts is a superset of Js; Meaning all Js code is also a valid Ts code -->
<!-- Ts has Object Oriented Features; Js not  -->
<!-- Ts detect errors at compile time; Js at runtime only -->
