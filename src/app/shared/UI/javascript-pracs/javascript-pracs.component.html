<div class="p-3">
    <div class="p-3 border border-1 border-dark rounded">
        <!-- String Interpolation -->
        <div>{{ title }}</div>
        <!-- Property Binding -->
        <div [innerText]="title"></div>

        <input type="text" [disabled]="isDisabled" placeholder="Enter text here" />
        <!-- Event Binding -->
        <button (click)="clickFunction(1,2)"></button>
        <!-- Two way data binding: Exchanging data from View to Component then from Component to View at the same time -->
        <input [(ngModel)]="name" type="text"/>
        <div>{{ name }}</div> 
    </div>
    <!-- Browser doesnt understand ts code. Thus Angular compiler transforms all the Ts Code to Js then runs it in the browser -->
    <!-- Ts is a strongly typed language; Js is loosely typed -->
    <!-- Ts is a superset of Js; Meaning all Js code is also a valid Ts code -->
    <!-- Ts has Object Oriented Features; Js not  -->
    <!-- Ts detect errors at compile time; Js at runtime only -->
</div>
